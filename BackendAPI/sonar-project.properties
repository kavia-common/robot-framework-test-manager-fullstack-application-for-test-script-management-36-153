sonar.projectKey=robot-framework-test-manager-backend
sonar.projectName=Robot Framework Test Manager - Backend API
sonar.projectVersion=1.0.0

# Source code paths
sonar.sources=src
sonar.tests=tests

# Python specific settings
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.pylint.reportPaths=pylint-report.txt

# Exclusions
sonar.exclusions=**/__pycache__/**,**/venv/**,**/migrations/**,**/.pytest_cache/**

# Coverage exclusions
sonar.coverage.exclusions=**/tests/**,**/conftest.py,**/__init__.py

# Encoding
sonar.sourceEncoding=UTF-8
